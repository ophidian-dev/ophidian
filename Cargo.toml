[workspace]
resolver = "3"
members = [
    "cli",
    "compiler",
    "frontend", "macros", 
    "op", 
    "runtime",
]

[workspace.dependencies] 
owo-colors = "4.3.0"
clap = { version = "4.6.6", features = ["derive"] }
frontend = { path = "frontend" }
compiler = { path = "compiler" }
runtime = { path = "runtime" }
cli = { path = "cli" }
num_enum = "0.7.6"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.4", features = ["full"] }